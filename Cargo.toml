[package]
name = "flowers"
version = "0.2.0"
edition = "2024"
description = "FlowJo alternative: open-source flow cytometry analysis in Rust"

[dependencies]
nom = "7.1"
byteorder = "1.5"
ndarray = "0.15"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization for project/workspace files
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GUI (egui / eframe)
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"
rfd = "0.14"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "flowers"
path = "src/main.rs"

[[bin]]
name = "flowers-gui"
path = "src/gui_main.rs"

[lib]
name = "flowers"
path = "src/lib.rs"
